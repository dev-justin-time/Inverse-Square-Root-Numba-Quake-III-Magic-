<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fast inverse square root algorithm diagram</title>
  <desc id="desc">A stylized illustration of a 64-bit Quake III initial guess and Newton-Raphson refinement used in a Numba loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>

  <text x="600" y="54" text-anchor="middle" fill="#e5e7eb" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    Fast Inverse Square Root in Numba
  </text>

  <g filter="url(#shadow)">
    <rect x="70" y="120" width="180" height="120" rx="16" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <text x="160" y="165" text-anchor="middle" fill="#93c5fd" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Input</text>
    <text x="160" y="198" text-anchor="middle" fill="#e5e7eb" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">x</text>
    <text x="160" y="225" text-anchor="middle" fill="#9ca3af" font-size="18" font-family="Segoe UI, Arial, sans-serif">float64</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="90" width="260" height="180" rx="18" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="460" y="130" text-anchor="middle" fill="#93c5fd" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Quake III magic</text>
    <text x="460" y="175" text-anchor="middle" fill="#e2e8f0" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">0x5fe6eb50c7b537a9</text>
    <text x="460" y="210" text-anchor="middle" fill="#86efac" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="600">bit-hack initial guess</text>
    <text x="460" y="242" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="Segoe UI, Arial, sans-serif">y ≈ 1 / √x</text>
  </g>

  <g>
    <path d="M250 180 H330" stroke="url(#accent)" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M590 180 H660" stroke="url(#accent)" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0,0 L12,6 L0,12 z" fill="#34d399"/>
      </marker>
    </defs>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="100" width="430" height="180" rx="18" fill="#111827" stroke="#34d399" stroke-width="2"/>
    <text x="875" y="140" text-anchor="middle" fill="#86efac" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Newton-Raphson refinement</text>
    <text x="875" y="185" text-anchor="middle" fill="#f8fafc" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">y = y × (1.5 - 0.5 × x × y²)</text>
    <text x="875" y="222" text-anchor="middle" fill="#a7f3d0" font-size="22" font-family="Segoe UI, Arial, sans-serif">3 iterations</text>
    <text x="875" y="252" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="Segoe UI, Arial, sans-serif">max relative error ≈ 3.17e-11</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="255" y="330" width="690" height="110" rx="18" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="600" y="365" text-anchor="middle" fill="#cbd5e1" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="600">Register-only scalar loop</text>
    <text x="600" y="400" text-anchor="middle" fill="#e2e8f0" font-size="24" font-family="Segoe UI, Arial, sans-serif">No large temporary arrays • CPU registers kept hot • Numba-optimized</text>
    <text x="600" y="425" text-anchor="middle" fill="#94a3b8" font-size="17" font-family="Segoe UI, Arial, sans-serif">Designed to beat NumPy vectorized allocation overhead</text>
  </g>
</svg>
